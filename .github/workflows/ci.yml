name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; only the coverage-report job (PR-only) elevates further, scoped to itself.
permissions:
  contents: read

env:
  POETRY_VERSION: "2.2.1"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  backend-lint:
    name: Backend / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install
      - run: poetry run ruff check .

  backend-typecheck:
    name: Backend / typecheck (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install
      - run: poetry run pyright

  backend-test:
    name: Backend / pytest
    runs-on: ubuntu-latest
    services:
      # Same dev-only credentials as dev/db.env.template; not secret.
      db:
        image: postgres:18
        env:
          POSTGRES_USER: radarsmith
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: radarsmith
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U radarsmith -d radarsmith"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install
      # Test config files target the devcontainer's docker-bridge address (172.17.0.1) for
      # local dev; the runner reaches the service container via localhost instead. Patched
      # here only, never committed.
      - run: sed -i 's/172.17.0.1/localhost/' backend/tests/config/*.env
      - run: >-
          poetry run pytest
          --cov=backend/app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=report.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            report.xml
            coverage.xml

  # PR-only: publishes the pytest/coverage results generated above as a check + PR comment.
  coverage-report:
    name: Backend / coverage report
    needs: backend-test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Only this job writes to the PR/checks API, and only for pull_request events.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: test-reports

      - name: Publish test results
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        with:
          name: pytest
          path: report.xml
          reporter: java-junit

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          format: markdown
          output: both

      - name: Add coverage to run summary
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        uses: marocchino/sticky-pull-request-comment@331f8f5b4215f0445d3c07b4967662a32a2d3e31 # v2.9.0
        with:
          header: coverage
          recreate: true
          path: code-coverage-results.md

  frontend-lint:
    name: Frontend / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  frontend-typecheck:
    name: Frontend / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend

  frontend-test:
    name: Frontend / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test
        working-directory: frontend

  frontend-build:
    name: Frontend / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  migrations:
    name: Migrations / upgrade + downgrade
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: radarsmith
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: radarsmith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radarsmith -d radarsmith"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install
      - run: echo "rs_api_db_url=postgresql+psycopg://radarsmith:devpass@localhost:5432/radarsmith" > backend/settings.env
      - run: make up-schema
      - run: make down-schema
      - run: make up-schema

  openapi-types-check:
    name: Generated OpenAPI types are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: poetry install
      - run: npm ci
        working-directory: frontend
      - run: make generate-api-types
      - run: git diff --exit-code backend/openapi.json frontend/src/api/schema.d.ts

  docker-build:
    name: Production image build (no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
