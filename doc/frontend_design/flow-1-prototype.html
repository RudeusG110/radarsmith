<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RadarSmith — Flow 1 Prototype</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a212b;
    --panel-2: #222b37;
    --border: #2d3846;
    --text: #e6edf3;
    --muted: #9aa7b4;
    --accent: #4c8dff;
    --accent-soft: #23344f;
    --danger: #ef4b5b;
    --ring-adopt: #3fb950;
    --ring-trial: #58a6ff;
    --ring-assess: #d29922;
    --ring-caution: #f85149;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  a { color: var(--accent); }

  /* ---------- App shell ---------- */
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  header.topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 5;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; letter-spacing: .2px; background: none; border: 0; color: var(--text);
    font-size: 16px;
  }
  .brand .logo { color: var(--accent); font-size: 18px; }
  .crumbs { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .crumbs button { background: none; border: 0; color: var(--muted); font-size: 14px; }
  .crumbs button:hover { color: var(--text); text-decoration: underline; }
  .spacer { flex: 1; }

  .btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.ghost { background: none; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .icon-btn { background: none; border: 0; color: var(--muted); font-size: 15px; padding: 6px; border-radius: 6px; }
  .icon-btn:hover { color: var(--danger); background: var(--panel-2); }

  main.content { flex: 1; padding: 24px 20px; max-width: 1200px; width: 100%; margin: 0 auto; }
  h1.page-title { font-size: 22px; margin: 0 0 4px; }
  .subtle { color: var(--muted); font-size: 14px; }

  /* ---------- Library ---------- */
  .lib-head { display: flex; align-items: flex-end; margin-bottom: 18px; }
  .radar-list { display: flex; flex-direction: column; gap: 12px; }
  .radar-card {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 18px; background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: border-color .12s, transform .06s;
  }
  .radar-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .radar-card .info { flex: 1; min-width: 0; }
  .radar-card .name { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 10px; }
  .radar-card .purpose { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .radar-card .meta { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .tag {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
    color: var(--accent); background: var(--accent-soft);
    border: 1px solid #34507d; padding: 2px 8px; border-radius: 999px;
  }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .btn { margin-top: 16px; }

  /* skeleton */
  .skeleton-row { height: 74px; border-radius: var(--radius); background:
    linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 50%, var(--panel) 100%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- Workspace ---------- */
  .ws-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .ws-head h1 { font-size: 20px; margin: 0; }
  .ws-head .edit-name { background: none; border: 0; color: var(--muted); font-size: 14px; }
  .ws-head .edit-name:hover { color: var(--text); }

  .tabs { display: none; gap: 6px; margin-bottom: 14px; }
  .tab {
    flex: 1; padding: 9px; text-align: center; border: 1px solid var(--border);
    background: var(--panel); color: var(--muted); border-radius: 8px; font-weight: 600; font-size: 14px;
  }
  .tab.active { background: var(--accent-soft); color: var(--text); border-color: var(--accent); }

  .ws-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }
  .panel .panel-title { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }

  table.blips { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.blips th { text-align: left; padding: 10px 14px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid var(--border); }
  table.blips td { padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.blips tr { cursor: pointer; }
  table.blips tbody tr:hover { background: var(--panel-2); }
  table.blips tr.selected { background: var(--accent-soft); }
  table.blips tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .blip-name { font-weight: 600; }
  select.cell {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 6px; font-size: 13px; font-family: inherit;
  }
  select.cell:focus { outline: 2px solid var(--accent); }
  .saving { font-size: 11px; color: var(--accent); margin-left: 6px; }

  .radar-wrap { padding: 14px; position: sticky; top: 76px; }
  svg.radar { width: 100%; height: auto; display: block; }
  .marker { cursor: pointer; }
  .marker circle { transition: r .1s, stroke-width .1s; }
  .marker text { font-size: 11px; font-weight: 700; fill: #fff; pointer-events: none; }
  .marker.selected circle { stroke: #fff; stroke-width: 3px; }
  .quad-label { fill: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .ring-label { fill: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .4px; }

  .detailbar {
    margin-top: 18px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); display: flex; align-items: center; gap: 14px;
  }
  .detailbar .d-name { font-weight: 700; }
  .detailbar .d-place { color: var(--muted); font-size: 13px; }
  .detailbar .d-desc { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detailbar.empty { color: var(--muted); font-size: 13px; justify-content: center; }

  /* ---------- Drawer ---------- */
  .drawer-scrim, .dialog-scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: none;
  }
  .drawer-scrim.open, .dialog-scrim.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 380px; max-width: 92vw;
    background: var(--panel); border-left: 1px solid var(--border); z-index: 21;
    transform: translateX(100%); transition: transform .18s ease; padding: 20px;
    display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
  }
  .drawer.open { transform: translateX(0); }
  .drawer h2 { margin: 0; font-size: 17px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 10px; font-size: 14px; font-family: inherit;
  }
  .field textarea { min-height: 84px; resize: vertical; }
  .field { margin-bottom: 4px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .drawer-actions { margin-top: auto; display: flex; justify-content: flex-end; gap: 10px; }

  /* ---------- Dialog ---------- */
  .dialog {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    z-index: 22; width: 420px; max-width: 92vw; padding: 20px; display: none;
    flex-direction: column; gap: 14px;
  }
  .dialog.open { display: flex; }
  .dialog h2 { margin: 0; font-size: 17px; }
  .dialog p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
  .dialog-head { display: flex; align-items: center; }
  .dialog-head .spacer { flex: 1; }
  .x { background: none; border: 0; color: var(--muted); font-size: 18px; }

  .hidden { display: none !important; }

  /* ---------- Responsive ---------- */
  @media (max-width: 820px) {
    .tabs { display: flex; }
    .ws-grid { grid-template-columns: 1fr; }
    .ws-grid.show-radar .table-panel { display: none; }
    .ws-grid.show-table .radar-panel { display: none; }
    .radar-wrap { position: static; }
    .radar-card .purpose { display: none; }
  }

  .hint-banner {
    background: var(--accent-soft); border: 1px solid #34507d; color: var(--text);
    padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .hint-banner .x { margin-left: auto; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="brand" onclick="goLibrary()"><span class="logo">◤</span> RadarSmith</button>
    <div class="crumbs" id="crumbs"></div>
    <div class="spacer"></div>
    <div id="topActions"></div>
  </header>
  <main class="content" id="view"></main>
</div>

<!-- Create radar dialog -->
<div class="dialog-scrim" id="createScrim" onclick="closeCreate()"></div>
<div class="dialog" id="createDialog" role="dialog" aria-modal="true" aria-labelledby="createTitle">
  <div class="dialog-head">
    <h2 id="createTitle">New radar</h2><div class="spacer"></div>
    <button class="x" onclick="closeCreate()" aria-label="Close">✕</button>
  </div>
  <div class="field">
    <label for="newName">Name *</label>
    <input id="newName" placeholder="e.g. Mobile Radar" />
  </div>
  <div class="field">
    <label for="newPurpose">Purpose (optional)</label>
    <input id="newPurpose" placeholder="What stance does this radar express?" />
  </div>
  <div class="dialog-actions">
    <button class="btn ghost" onclick="closeCreate()">Cancel</button>
    <button class="btn primary" onclick="submitCreate()">Create radar</button>
  </div>
</div>

<!-- Confirm delete dialog -->
<div class="dialog-scrim" id="confirmScrim" onclick="closeConfirm()"></div>
<div class="dialog" id="confirmDialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="dialog-head">
    <h2 id="confirmTitle">Delete radar?</h2><div class="spacer"></div>
    <button class="x" onclick="closeConfirm()" aria-label="Close">✕</button>
  </div>
  <p id="confirmBody"></p>
  <div class="dialog-actions">
    <button class="btn ghost" onclick="closeConfirm()">Cancel</button>
    <button class="btn danger" id="confirmBtn">Delete</button>
  </div>
</div>

<!-- Blip edit drawer -->
<div class="drawer-scrim" id="drawerScrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div style="display:flex;align-items:center">
    <h2 id="drawerTitle">Edit blip</h2><div class="spacer" style="flex:1"></div>
    <button class="x" onclick="closeDrawer()" aria-label="Close">✕</button>
  </div>
  <div class="field">
    <label for="blipName">Name *</label>
    <input id="blipName" />
  </div>
  <div class="field">
    <label for="blipDesc">Description *</label>
    <textarea id="blipDesc"></textarea>
  </div>
  <div class="field-row">
    <div class="field">
      <label for="blipQuad">Quadrant</label>
      <select id="blipQuad"></select>
    </div>
    <div class="field">
      <label for="blipRing">Ring</label>
      <select id="blipRing"></select>
    </div>
  </div>
  <div class="drawer-actions">
    <button class="btn ghost" onclick="closeDrawer()">Cancel</button>
    <button class="btn primary" onclick="saveDrawer()">Save</button>
  </div>
</aside>

<script>
/* ============================================================
   MOCK DATA — stands in for the FastAPI backend.
   On a fresh install the bundled radar always exists (TICKET-010).
   ============================================================ */
const QUADRANTS = ["Techniques", "Platforms", "Tools", "Languages & Frameworks"];
const RINGS = ["Adopt", "Trial", "Assess", "Caution"];
const RING_COLORS = ["var(--ring-adopt)","var(--ring-trial)","var(--ring-assess)","var(--ring-caution)"];

let radars = [
  {
    id: "r-bundled", name: "Engineering Radar", purpose: "Our current tech stances",
    bundled: true,
    blips: [
      { id: "b1", name: "PostgreSQL", q: 2, r: 0, desc: "Primary relational store. See https://postgresql.org" },
      { id: "b2", name: "React", q: 3, r: 0, desc: "Default UI library for web apps." },
      { id: "b3", name: "Kafka", q: 1, r: 1, desc: "Event streaming backbone." },
      { id: "b4", name: "Deno", q: 3, r: 2, desc: "Evaluating as a Node alternative." },
      { id: "b5", name: "Trunk-based dev", q: 0, r: 0, desc: "Short-lived branches, frequent merges." },
      { id: "b6", name: "GraphQL", q: 0, r: 2, desc: "Assessing for aggregation layer." },
      { id: "b7", name: "Terraform", q: 2, r: 1, desc: "Infra as code for cloud resources." },
      { id: "b8", name: "Service mesh", q: 1, r: 3, desc: "Complexity outweighs benefit for us now." },
    ],
  },
  {
    id: "r-data", name: "Data Platform Radar", purpose: "Warehouse & pipeline choices",
    bundled: false,
    blips: [
      { id: "d1", name: "dbt", q: 0, r: 0, desc: "Transformation layer standard." },
      { id: "d2", name: "Snowflake", q: 1, r: 1, desc: "Trialling as warehouse." },
    ],
  },
];

/* ============================================================
   STATE
   ============================================================ */
let route = { name: "library", radarId: null };
let selectedBlipId = null;
let narrowTab = "table"; // table | radar
let editingBlipId = null;
let confirmAction = null;

const $ = (id) => document.getElementById(id);
const view = $("view");

function currentRadar() { return radars.find(r => r.id === route.radarId); }

/* ============================================================
   ROUTER
   ============================================================ */
function goLibrary() { route = { name: "library", radarId: null }; selectedBlipId = null; render(); }
function goWorkspace(id) { route = { name: "workspace", radarId: id }; selectedBlipId = null; narrowTab = "table"; render(); }

function render() {
  renderTopbar();
  if (route.name === "library") renderLibrary();
  else renderWorkspace();
}

function renderTopbar() {
  const crumbs = $("crumbs");
  const actions = $("topActions");
  if (route.name === "library") {
    crumbs.innerHTML = "";
    actions.innerHTML = `<button class="btn primary" onclick="openCreate()">+ New Radar</button>`;
  } else {
    crumbs.innerHTML = `<span>›</span><button onclick="goLibrary()">Radars</button>`;
    actions.innerHTML = `<button class="btn primary" onclick="openBlipDrawer(null)">+ Add Blip</button>`;
  }
}

/* ============================================================
   LIBRARY SCREEN
   ============================================================ */
function renderLibrary() {
  if (radars.length === 0) {
    view.innerHTML = `
      <div class="empty-state">
        <div style="font-size:15px">You have no radars yet.</div>
        <button class="btn primary" onclick="openCreate()">+ Create your first radar</button>
      </div>`;
    return;
  }
  const rows = radars.map(r => `
    <div class="radar-card" onclick="goWorkspace('${r.id}')">
      <div class="info">
        <div class="name">${escapeHtml(r.name)} ${r.bundled ? '<span class="tag">Start here</span>' : ''}</div>
        <div class="purpose">${escapeHtml(r.purpose || "No purpose set")}</div>
      </div>
      <div class="meta">${r.blips.length} blip${r.blips.length === 1 ? "" : "s"}</div>
      <button class="icon-btn" title="Delete radar"
        onclick="event.stopPropagation(); askDeleteRadar('${r.id}')">🗑</button>
    </div>`).join("");
  view.innerHTML = `
    <div class="lib-head"><div><h1 class="page-title">Radars</h1>
      <div class="subtle">${radars.length} radar${radars.length===1?"":"s"} · self-hosted, single author</div></div></div>
    <div class="radar-list">${rows}</div>`;
}

/* ============================================================
   WORKSPACE SCREEN
   ============================================================ */
function renderWorkspace() {
  const radar = currentRadar();
  if (!radar) { goLibrary(); return; }
  const gridClass = narrowTab === "radar" ? "show-radar" : "show-table";

  view.innerHTML = `
    <div class="ws-head">
      <h1>${escapeHtml(radar.name)}</h1>
      <button class="edit-name" title="Rename (prototype)">✎</button>
      <span class="subtle">${escapeHtml(radar.purpose || "")}</span>
    </div>
    <div class="tabs">
      <button class="tab ${narrowTab==='table'?'active':''}" onclick="setTab('table')">Blips</button>
      <button class="tab ${narrowTab==='radar'?'active':''}" onclick="setTab('radar')">Radar</button>
    </div>
    <div class="ws-grid ${gridClass}">
      <div class="panel table-panel">
        <div class="panel-title">Blips (authoritative)</div>
        ${renderTable(radar)}
      </div>
      <div class="panel radar-panel">
        <div class="panel-title">Radar (live view)</div>
        <div class="radar-wrap">${renderRadar(radar)}</div>
      </div>
    </div>
    ${renderDetailBar(radar)}`;
}

function renderTable(radar) {
  if (radar.blips.length === 0) {
    return `<div style="padding:24px;color:var(--muted);text-align:center">
      No blips yet. Use <strong>+ Add Blip</strong> to place your first one.</div>`;
  }
  const rows = radar.blips.map(b => `
    <tr class="${b.id===selectedBlipId?'selected':''}" onclick="selectBlip('${b.id}')">
      <td class="blip-name">${escapeHtml(b.name)}</td>
      <td><select class="cell" onclick="event.stopPropagation()"
            onchange="changePlacement('${b.id}','q',this)">
            ${QUADRANTS.map((q,i)=>`<option value="${i}" ${i===b.q?'selected':''}>${q}</option>`).join("")}
          </select><span class="saving hidden" id="sv-q-${b.id}">saving…</span></td>
      <td><select class="cell" onclick="event.stopPropagation()"
            onchange="changePlacement('${b.id}','r',this)">
            ${RINGS.map((r,i)=>`<option value="${i}" ${i===b.r?'selected':''}>${r}</option>`).join("")}
          </select><span class="saving hidden" id="sv-r-${b.id}">saving…</span></td>
      <td style="text-align:right"><button class="icon-btn" title="Delete blip"
            onclick="event.stopPropagation(); askDeleteBlip('${b.id}')">🗑</button></td>
    </tr>`).join("");
  return `<table class="blips"><thead><tr>
      <th>Name</th><th>Quadrant</th><th>Ring</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
}

function renderDetailBar(radar) {
  const b = radar.blips.find(x => x.id === selectedBlipId);
  if (!b) return `<div class="detailbar empty">Select a blip (row or marker) to see its full details here.</div>`;
  return `<div class="detailbar">
      <span class="d-name">${escapeHtml(b.name)}</span>
      <span class="d-place">${QUADRANTS[b.q]} · ${RINGS[b.r]}</span>
      <span class="d-desc">${linkify(b.desc)}</span>
      <button class="btn small" onclick="openBlipDrawer('${b.id}')">Edit</button>
    </div>`;
}

/* ============================================================
   RADAR SVG — deterministic marker placement (seeded by blip id)
   ============================================================ */
function seededJitter(id, salt) {
  let h = 2166136261;
  const s = id + ":" + salt;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 1000) / 1000; // 0..1
}

function markerPos(b, R) {
  // Quadrant angular sectors (degrees, standard math, CCW). Convert to SVG (y down).
  // q0 top-right:0-90, q1 top-left:90-180, q2 bottom-left:180-270, q3 bottom-right:270-360
  const startDeg = b.q * 90;
  const aFrac = 0.15 + 0.7 * seededJitter(b.id, "a");
  const angle = (startDeg + aFrac * 90) * Math.PI / 180;
  const ringInner = (b.r) * R / 4;
  const ringOuter = (b.r + 1) * R / 4;
  const rFrac = 0.25 + 0.5 * seededJitter(b.id, "r");
  const rad = ringInner + rFrac * (ringOuter - ringInner);
  return { x: Math.cos(angle) * rad, y: -Math.sin(angle) * rad };
}

function renderRadar(radar) {
  const size = 460, cx = size/2, cy = size/2, R = size/2 - 30;
  let svg = `<svg class="radar" viewBox="0 0 ${size} ${size}" role="graphics-document"
      aria-label="Radar for ${escapeHtml(radar.name)}">`;
  // rings
  for (let i = 4; i >= 1; i--) {
    const rr = i * R / 4;
    svg += `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="${i%2? '#151c25':'#111820'}"
        stroke="var(--border)" stroke-width="1"/>`;
  }
  // quadrant divider lines
  svg += `<line x1="${cx-R}" y1="${cy}" x2="${cx+R}" y2="${cy}" stroke="var(--border)"/>`;
  svg += `<line x1="${cx}" y1="${cy-R}" x2="${cx}" y2="${cy+R}" stroke="var(--border)"/>`;
  // ring labels (along top)
  for (let i = 0; i < 4; i++) {
    const rr = (i + 0.5) * R / 4;
    svg += `<text class="ring-label" x="${cx}" y="${cy - rr + 3}" text-anchor="middle">${RINGS[i]}</text>`;
  }
  // quadrant labels
  const ql = [
    { x: cx + R*0.55, y: cy - R*0.9, t: QUADRANTS[0] },
    { x: cx - R*0.55, y: cy - R*0.9, t: QUADRANTS[1] },
    { x: cx - R*0.55, y: cy + R*0.98, t: QUADRANTS[2] },
    { x: cx + R*0.55, y: cy + R*0.98, t: QUADRANTS[3] },
  ];
  ql.forEach(l => { svg += `<text class="quad-label" x="${l.x}" y="${l.y}" text-anchor="middle">${l.t}</text>`; });
  // markers
  radar.blips.forEach((b, idx) => {
    const p = markerPos(b, R);
    const x = cx + p.x, y = cy + p.y;
    const sel = b.id === selectedBlipId ? "selected" : "";
    svg += `<g class="marker ${sel}" role="graphics-symbol img"
        aria-label="${escapeHtml(b.name)}, ${QUADRANTS[b.q]}, ${RINGS[b.r]}"
        onclick="selectBlip('${b.id}')" tabindex="0">
        <circle cx="${x}" cy="${y}" r="12" fill="${RING_COLORS[b.r]}" stroke="#0f1419" stroke-width="1.5"/>
        <text x="${x}" y="${y+4}" text-anchor="middle">${idx+1}</text></g>`;
  });
  svg += `</svg>`;
  return svg;
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
function selectBlip(id) { selectedBlipId = (selectedBlipId === id ? null : id); render(); scrollSelectedIntoView(); }
function scrollSelectedIntoView() {
  const row = document.querySelector("tr.selected");
  if (row) row.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function setTab(t) { narrowTab = t; render(); }

function changePlacement(id, dim, sel) {
  const radar = currentRadar();
  const b = radar.blips.find(x => x.id === id);
  const badge = $(`sv-${dim}-${id}`);
  badge.classList.remove("hidden");
  // simulate immediate save with a short pending state (rolls back on error in real app)
  setTimeout(() => {
    if (dim === "q") b.q = parseInt(sel.value, 10); else b.r = parseInt(sel.value, 10);
    render(); // re-render so the marker moves live
  }, 350);
}

/* ---- create radar ---- */
function openCreate() { $("createScrim").classList.add("open"); $("createDialog").classList.add("open"); $("newName").value=""; $("newPurpose").value=""; setTimeout(()=>$("newName").focus(),50); }
function closeCreate() { $("createScrim").classList.remove("open"); $("createDialog").classList.remove("open"); }
function submitCreate() {
  const name = $("newName").value.trim();
  if (!name) { $("newName").focus(); $("newName").style.borderColor = "var(--danger)"; return; }
  const id = "r-" + Date.now();
  radars.push({ id, name, purpose: $("newPurpose").value.trim(), bundled: false, blips: [] });
  closeCreate();
  goWorkspace(id); // navigate straight into the new radar's workspace
}

/* ---- blip drawer ---- */
function openBlipDrawer(id) {
  const radar = currentRadar();
  editingBlipId = id;
  $("drawerTitle").textContent = id ? "Edit blip" : "Add blip";
  $("blipQuad").innerHTML = QUADRANTS.map((q,i)=>`<option value="${i}">${q}</option>`).join("");
  $("blipRing").innerHTML = RINGS.map((r,i)=>`<option value="${i}">${r}</option>`).join("");
  if (id) {
    const b = radar.blips.find(x => x.id === id);
    $("blipName").value = b.name; $("blipDesc").value = b.desc;
    $("blipQuad").value = b.q; $("blipRing").value = b.r;
  } else {
    $("blipName").value = ""; $("blipDesc").value = ""; $("blipQuad").value = 0; $("blipRing").value = 0;
  }
  $("drawerScrim").classList.add("open"); $("drawer").classList.add("open");
  setTimeout(()=>$("blipName").focus(),50);
}
function closeDrawer() { $("drawerScrim").classList.remove("open"); $("drawer").classList.remove("open"); }
function saveDrawer() {
  const radar = currentRadar();
  const name = $("blipName").value.trim();
  const desc = $("blipDesc").value.trim();
  if (!name || !desc) { alert("Name and description are required."); return; }
  const q = parseInt($("blipQuad").value,10), r = parseInt($("blipRing").value,10);
  if (editingBlipId) {
    const b = radar.blips.find(x => x.id === editingBlipId);
    b.name = name; b.desc = desc; b.q = q; b.r = r;
    selectedBlipId = b.id;
  } else {
    const id = "b-" + Date.now();
    radar.blips.push({ id, name, desc, q, r });
    selectedBlipId = id;
  }
  closeDrawer(); render();
}

/* ---- delete confirm ---- */
function askDeleteRadar(id) {
  const r = radars.find(x => x.id === id);
  $("confirmTitle").textContent = `Delete “${r.name}”?`;
  $("confirmBody").textContent = `This permanently removes the radar and all ${r.blips.length} of its blips. This cannot be undone.`;
  $("confirmBtn").textContent = "Delete radar";
  confirmAction = () => { radars = radars.filter(x => x.id !== id); closeConfirm(); if (route.radarId===id) goLibrary(); else render(); };
  openConfirm();
}
function askDeleteBlip(id) {
  const radar = currentRadar();
  const b = radar.blips.find(x => x.id === id);
  $("confirmTitle").textContent = `Delete “${b.name}”?`;
  $("confirmBody").textContent = `This blip will be removed from the radar. This cannot be undone.`;
  $("confirmBtn").textContent = "Delete blip";
  confirmAction = () => { radar.blips = radar.blips.filter(x => x.id !== id); if (selectedBlipId===id) selectedBlipId=null; closeConfirm(); render(); };
  openConfirm();
}
function openConfirm() { $("confirmScrim").classList.add("open"); $("confirmDialog").classList.add("open"); }
function closeConfirm() { $("confirmScrim").classList.remove("open"); $("confirmDialog").classList.remove("open"); confirmAction = null; }
$("confirmBtn").addEventListener("click", () => { if (confirmAction) confirmAction(); });

/* ---- utils ---- */
function escapeHtml(s) { return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function linkify(s) {
  return escapeHtml(s).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDrawer(); closeCreate(); closeConfirm(); } });

/* boot */
render();
</script>
