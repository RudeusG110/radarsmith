[project]
name = "radarsmith"
version = "0.1.0"
description = "Forge your own radar."
authors = [{ name = "Your Name", email = "you@example.com" }]
license = ""
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.139.2"
pydantic-settings = "^2.14.2"
sqlalchemy = "^2.0.51"
alembic = "^1.18.5"
uvicorn = "^0.51.0"
psycopg = { extras = ["binary"], version = "^3.3.4" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff (==0.15.22)",
    "httpx>=0.28,<1.0",
    "pyright[nodejs]>=1.1.411,<2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
    "no_base_tables: start the test from an empty schema without the seeded base tables",
]

[tool.coverage.run]
omit = ["backend/alembic/env.py", "backend/tests/**/conftest.py"]
